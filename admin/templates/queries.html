{% extends "layout.html" %}

{% block title %}Queries{% endblock %}
{% block header_title %}Communication Hub{% endblock %}

{% block content %}
<div class="glass-card rounded-[2.5rem] overflow-hidden">
    <div class="px-10 py-8 border-b border-gray-50 flex items-center justify-between bg-white/40">
        <div>
            <h4 class="text-lg font-black text-[#0f172a] tracking-tight">Active Inquiries</h4>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Client Relations Management
            </p>
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead>
                <tr
                    class="bg-gray-50/50 text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] border-b border-gray-100">
                    <th class="px-10 py-5">Full Name</th>
                    <th class="px-10 py-5">Email</th>
                    <th class="px-10 py-5">Phone</th>
                    <th class="px-10 py-5">Topic</th>
                    <th class="px-10 py-5 text-center">Message</th>
                    <th class="px-10 py-5 text-center">Time</th>
                    <th class="px-10 py-5 text-center">Status</th>
                    <th class="px-10 py-5 text-center">Action</th>
                </tr>
            </thead>
            <tbody id="query-list" class="divide-y divide-gray-50">
                <!-- Data injected via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="query-modal"
    class="hidden fixed inset-0 bg-[#0f172a]/40 backdrop-blur-md flex items-center justify-center p-6 z-50">
    <div class="glass-card w-full max-w-lg rounded-[3rem] p-12">
        <div class="flex justify-between items-center mb-10">
            <h3 class="text-3xl font-black text-[#0f172a] tracking-tight">Management</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors"><i
                    class="fas fa-times text-xl"></i></button>
        </div>

        <input type="hidden" id="query-id">
        <div class="space-y-10">
            <div>
                <label
                    class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-4 ml-4">Inquiry
                    Statement</label>
                <div class="bg-gray-50 p-8 rounded-[2rem] border border-gray-100">
                    <p id="view-message" class="text-sm font-semibold text-gray-600 italic leading-relaxed"></p>
                </div>
            </div>

            <div class="space-y-4">
                <label
                    class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest ml-4">Administrative
                    Response</label>
                <textarea id="admin-response" rows="3"
                    class="w-full px-8 py-6 rounded-[2rem] bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 font-semibold text-sm transition-all"></textarea>
            </div>

            <div class="space-y-4">
                <label class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest ml-4">Resolve
                    Status</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setStatus('Pending')"
                        class="py-3 bg-amber-50 text-amber-600 text-[10px] font-black uppercase tracking-widest rounded-full border border-amber-100 hover:bg-amber-100 transition-all">Pending</button>
                    <button onclick="setStatus('Solved')"
                        class="py-3 bg-green-50 text-green-600 text-[10px] font-black uppercase tracking-widest rounded-full border border-green-100 hover:bg-green-100 transition-all">Solved</button>
                    <button onclick="setStatus('Rejected')"
                        class="py-3 bg-red-50 text-red-600 text-[10px] font-black uppercase tracking-widest rounded-full border border-red-100 hover:bg-red-100 transition-all">Rejected</button>
                </div>
            </div>
        </div>
        <div class="flex justify-center pt-10">
            <button onclick="closeModal()"
                class="text-[10px] font-black text-gray-400 uppercase tracking-widest hover:text-gray-900 transition-colors">Dismiss
                Hub</button>
        </div>
    </div>
</div>

<script src="{{ url_for('admin.static', filename='js/queries.js') }}"></script>
{% endblock %}
