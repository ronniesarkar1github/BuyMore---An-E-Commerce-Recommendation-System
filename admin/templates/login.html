<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyMore Admin - Portal Access</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/login.css') }}">
</head>

<body class="h-screen flex items-center justify-center p-6 overflow-hidden">
    <div class="max-w-md w-full auth-card rounded-[2.5rem] p-12 relative overflow-hidden">
        <!-- Subtle Branding Element -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-teal-500/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-[#0f172a] tracking-tight mb-2">BuyMore</h1>
                <p class="text-[10px] uppercase tracking-[0.4em] font-bold text-teal-600" id="step-desc">Administrator
                    Auth</p>
            </div>

            <!-- Login Step (Email Only) -->
            <div id="login-step" class="space-y-8">
                <div class="relative">
                    <label
                        class="block text-[11px] font-extrabold text-gray-400 uppercase tracking-widest mb-3 ml-4">Corporate
                        Email</label>
                    <input type="email" id="email"
                        class="w-full px-6 py-4 input-pill focus:outline-none font-medium placeholder:text-gray-300"
                        placeholder="admin@buymore.com">
                </div>
                <button onclick="handleLogin()" id="login-btn"
                    class="w-full primary-pill text-white font-bold py-5 flex items-center justify-center space-x-3 group">
                    <span>Request Access Code</span>
                    <i class="fas fa-arrow-right text-xs opacity-50 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>

            <!-- OTP Step -->
            <div id="otp-step" class="hidden space-y-8">
                <div class="relative text-center">
                    <label class="block text-[11px] font-extrabold text-gray-400 uppercase tracking-widest mb-3">6-Digit
                        Key</label>
                    <input type="text" id="otp"
                        class="w-full px-4 py-6 bg-transparent border-b-2 border-gray-200 focus:border-teal-600 focus:outline-none text-center text-4xl tracking-[0.5em] font-bold font-mono text-[#0f172a]"
                        maxlength="6" placeholder="000000">
                </div>
                <button onclick="handleVerify()" id="verify-btn"
                    class="w-full primary-pill text-white font-bold py-5 flex items-center justify-center space-x-3 bg-teal-700 hover:bg-teal-800">
                    <span>Secure Authorization</span>
                </button>
                <div class="text-center">
                    <button onclick="resendLogin()"
                        class="text-[10px] font-bold text-teal-700 uppercase tracking-widest hover:text-teal-900 border-b border-teal-200 pb-0.5">Change
                        Email</button>
                </div>
            </div>

            <p id="error-msg" class="mt-8 text-[11px] text-center text-red-500 font-bold uppercase tracking-wider h-4">
            </p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="{{ url_for('admin.static', filename='js/login.js') }}"></script>
</body>

</html>
